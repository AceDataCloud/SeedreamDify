identity:
  name: seedream_decompose_image
  author: acedatacloud
  label:
    en_US: Seedream Decompose Image
    zh_Hans: Seedream 图层拆分
description:
  human:
    en_US: Split one image into a base plus editable transparent layers.
    zh_Hans: 将一张图片拆分为底图和可编辑透明图层。
  llm: Split one image into a base plus editable transparent layers. For asynchronous
    results, preserve task_id and use the task retrieval tool until completion. A
    successful submission is not completed output.
parameters:
- name: prompt
  type: string
  required: false
  form: llm
  label:
    en_US: Elements
    zh_Hans: 拆分元素
  human_description:
    en_US: Optional elements or <bbox> regions; omit for automatic decomposition.
    zh_Hans: 图片生成或编辑提示词。仅在 5.0 Pro 图层拆分模式下可省略；省略时自动识别并拆分主要元素。
  llm_description: Optional elements or <bbox> regions; omit for automatic decomposition.
- name: image
  type: string
  required: false
  form: form
  label:
    en_US: Image
    zh_Hans: 参考图片
  human_description:
    en_US: Set image. Enter a JSON array or object where applicable. Enter a JSON
      array or object where applicable. Enter a JSON array or object where applicable.
      Enter a JSON array or object where applicable. Enter a JSON array or object
      where applicable. Enter a JSON array or object where applicable.
    zh_Hans: 参考图片，支持单个 URL/Base64 字符串或字符串数组。5.0 Pro 普通模式最多 10 张、图层拆分恰好 1 张；5.0 Lite/4.x
      最多 14 张。单张图片最大 30MB。 数组或对象请使用 JSON 格式。
  llm_description: Set image. Enter a JSON array or object where applicable. Enter
    a JSON array or object where applicable. Enter a JSON array or object where applicable.
    Enter a JSON array or object where applicable. Enter a JSON array or object where
    applicable. Enter a JSON array or object where applicable.
- name: size
  type: string
  required: false
  form: form
  label:
    en_US: Size
    zh_Hans: 尺寸
  human_description:
    en_US: auto, 1K, 1.5K, or 2K.
    zh_Hans: 输出尺寸。5.0 Pro 普通模式支持 1K/1.5K/2K 或合法像素值，拆层支持 auto/1K/1.5K/2K；5.0 Lite 支持
      2K/3K/4K 或合法像素值。
  llm_description: auto, 1K, 1.5K, or 2K.
  default: auto
- name: sequential_image_generation
  type: select
  required: false
  form: form
  label:
    en_US: Sequential Image Generation
    zh_Hans: 组图模式
  human_description:
    en_US: Set sequential image generation.
    zh_Hans: 默认值为 `disabled`。设置为 `auto` 可让模型生成一组风格连贯的相关图像（多图一致性，跨帧共享角色、风格与细节）。仅支持
      `doubao-seedream-5.0-lite`、`doubao-seedream-4.5` 和 `doubao-seedream-4.0`。
  llm_description: Set sequential image generation.
  options:
  - value: auto
    label:
      en_US: auto
      zh_Hans: auto
  - value: disabled
    label:
      en_US: disabled
      zh_Hans: disabled
- name: sequential_image_generation_options
  type: string
  required: false
  form: form
  label:
    en_US: Sequential Image Generation Options
    zh_Hans: 组图设置
  human_description:
    en_US: Set sequential image generation options. Enter a JSON object. Enter a JSON
      array or object where applicable. Enter a JSON array or object where applicable.
      Enter a JSON array or object where applicable. Enter a JSON array or object
      where applicable. Enter a JSON array or object where applicable. Enter a JSON
      array or object where applicable.
    zh_Hans: 批量图像生成的可调参数。仅在 `sequential_image_generation=auto` 时生效。仅支持 `doubao-seedream-5.0-lite`、`doubao-seedream-4.5`
      和 `doubao-seedream-4.0`。 数组或对象请使用 JSON 格式。
  llm_description: Set sequential image generation options. Enter a JSON object. Enter
    a JSON array or object where applicable. Enter a JSON array or object where applicable.
    Enter a JSON array or object where applicable. Enter a JSON array or object where
    applicable. Enter a JSON array or object where applicable. Enter a JSON array
    or object where applicable.
- name: watermark
  type: boolean
  required: false
  form: form
  label:
    en_US: Watermark
    zh_Hans: 水印
  human_description:
    en_US: Add an AI watermark.
    zh_Hans: 是否添加 AI 生成水印，默认为 `true`。
  llm_description: Add an AI watermark.
- name: output_format
  type: select
  required: false
  form: form
  label:
    en_US: Base format
    zh_Hans: 底图格式
  human_description:
    en_US: Base jpeg/png; layers are always PNG.
    zh_Hans: 输出图像的文件格式，默认为 `jpeg`。仅支持 `doubao-seedream-5.0-pro` 和 `doubao-seedream-5.0-lite`。
  llm_description: Base jpeg/png; layers are always PNG.
  options:
  - value: jpeg
    label:
      en_US: jpeg
      zh_Hans: jpeg
  - value: png
    label:
      en_US: png
      zh_Hans: png
- name: tools
  type: string
  required: false
  form: form
  label:
    en_US: Tools
    zh_Hans: 搜索工具
  human_description:
    en_US: Set tools. Enter a JSON array. Enter a JSON array or object where applicable.
      Enter a JSON array or object where applicable. Enter a JSON array or object
      where applicable. Enter a JSON array or object where applicable. Enter a JSON
      array or object where applicable. Enter a JSON array or object where applicable.
    zh_Hans: 模型可调用的工具列表。目前仅支持 `web_search`。仅适用于 `doubao-seedream-5.0-lite`。 数组或对象请使用
      JSON 格式。
  llm_description: Set tools. Enter a JSON array. Enter a JSON array or object where
    applicable. Enter a JSON array or object where applicable. Enter a JSON array
    or object where applicable. Enter a JSON array or object where applicable. Enter
    a JSON array or object where applicable. Enter a JSON array or object where applicable.
- name: optimize_prompt_options
  type: string
  required: false
  form: form
  label:
    en_US: Optimize Prompt Options
    zh_Hans: 提示词优化设置
  human_description:
    en_US: Set optimize prompt options. Enter a JSON object. Enter a JSON array or
      object where applicable. Enter a JSON array or object where applicable. Enter
      a JSON array or object where applicable. Enter a JSON array or object where
      applicable. Enter a JSON array or object where applicable. Enter a JSON array
      or object where applicable.
    zh_Hans: 提示词优化配置。5.0 Pro 支持 standard/fast；5.0 Lite 与 4.5 仅支持 standard；4.0 支持 standard/fast。
      请填写 JSON 对象。 数组或对象请使用 JSON 格式。 数组或对象请使用 JSON 格式。 数组或对象请使用 JSON 格式。 数组或对象请使用
      JSON 格式。 数组或对象请使用 JSON 格式。 数组或对象请使用 JSON 格式。
  llm_description: Set optimize prompt options. Enter a JSON object. Enter a JSON
    array or object where applicable. Enter a JSON array or object where applicable.
    Enter a JSON array or object where applicable. Enter a JSON array or object where
    applicable. Enter a JSON array or object where applicable. Enter a JSON array
    or object where applicable.
- name: callback_url
  type: string
  required: false
  form: form
  label:
    en_US: Callback Url
    zh_Hans: 回调 URL
  human_description:
    en_US: Set callback url for this operation.
    zh_Hans: 图像生成完成后的回调 URL，该 URL 须可从公网访问。指定后接口将立即返回，生成结果就绪时会异步推送至此回调地址。
  llm_description: Set callback url for this operation.
- name: background
  type: select
  required: false
  form: form
  label:
    en_US: Background
    zh_Hans: 背景
  human_description:
    en_US: Set background.
    zh_Hans: 5.0 Pro 单图编辑的背景模式。transparent 仅支持输入一张带透明通道的 PNG，且输出必须为 PNG；opaque 为普通不透明背景。
  llm_description: Set background.
  options:
  - value: transparent
    label:
      en_US: transparent
      zh_Hans: transparent
  - value: opaque
    label:
      en_US: opaque
      zh_Hans: opaque
output_schema:
  type: object
  properties:
    status:
      type: string
    success:
      type: boolean
    task_id:
      type: string
    trace_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    data: {}
    result:
      type: object
extra:
  python:
    source: tools/seedream_decompose.py
